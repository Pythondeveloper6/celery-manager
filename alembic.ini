# Contributor-only Alembic config, for generating new revisions of
# celery-manager's schema. Users never need this file: the migrations ship
# inside the package and `celery_manager.db.migrate` configures Alembic
# programmatically. See docs/contributing.md, "Schema changes".

[alembic]
script_location = src/celery_manager/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
# Scratch database for autogenerate (gitignored via *.db). Override with
# `alembic -x db_url=postgresql://... <command>`.
sqlalchemy.url = sqlite:///alembic-scratch.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

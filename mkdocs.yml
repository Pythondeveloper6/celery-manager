site_name: celery-manager
site_description: A dashboard and control API for Celery background tasks. See every run, cancel or retry it, and pause a single future occurrence of a periodic task.
site_author: Mahmoud Ahmed
site_url: https://pythondeveloper6.github.io/celery-manager/
repo_url: https://github.com/Pythondeveloper6/celery-manager
repo_name: Pythondeveloper6/celery-manager
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mahmoud Ahmed &middot; MIT licence

# Internal design records, not user documentation.
exclude_docs: |
  superpowers/

strict: true
validation:
  links:
    anchors: warn

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Pythondeveloper6/celery-manager
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/celery-manager/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's heading ids, so an anchor link works on github.com and here alike.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Features: features.md
  - Guide:
      - Is it the right tool?: choosing.md
      - Quickstart: quickstart.md
      - Integrating with your app: integrations.md
      - Production adoption: production.md
      - 0.3 release guide: release-0.3.md
      - Real-world operations: real-world-operations.md
      - Other task runners: other-runners.md
      - Moving from Flower: flower-compat.md
      - Tenant-scoped history: tenancy.md
      - API and embedding: embedding.md
      - Browser sessions: auth-sessions.md
      - Beat liveness: beat-liveness.md
      - The decorator: decorator.md
      - Editing schedules: schedules.md
      - Live progress: progress.md
      - Dashboard: dashboard.md
      - Insights: insights.md
      - Workers and rate limits: workers.md
      - Queues, purge and bulk cancel: queues.md
      - RabbitMQ: rabbitmq.md
      - Dead letters: dead-letters.md
      - Data retention: retention.md
      - Metrics: metrics.md
      - Alerts: alerts.md
      - Roles: roles.md
  - SQL schedules: sql-schedules.md
  - Singleton tasks: singleton.md
  - Reference:
      - REST API: rest-api.md
      - Configuration: configuration.md
  - Project:
      - Working on celery-manager: contributing.md
      - Changelog: changelog.md
      - Security: security.md
      - Stability policy: stability.md
      - Roadmap: roadmap.md

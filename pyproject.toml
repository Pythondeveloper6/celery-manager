[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celery-manager"
version = "0.1.0a3"
description = "A dashboard and control API for Celery background tasks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pythondeveloper6", email = "pythondeveloper6@gmail.com" }]
keywords = ["celery", "dashboard", "monitoring", "task-queue", "scheduler"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Celery",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Distributed Computing",
    # No "Typing :: Typed" — the code is annotated throughout, but the package
    # ships no py.typed marker, so type checkers won't use those annotations
    # from an installed copy. Add both together or neither.
]
dependencies = [
    "celery>=5.3,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    # Declared explicitly even though FastAPI already pulls it in: the route
    # modules `import pydantic` directly, and the `>=2` floor is load-bearing
    # rather than cosmetic. FastAPI still supports pydantic v1, so without
    # this an install could resolve to v1 and then fail at import time on
    # `ConfigDict` / `model_dump(exclude_unset=...)` in
    # api/routes/settings.py.
    "pydantic>=2.0,<3.0",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
]

[project.urls]
Homepage = "https://github.com/Pythondeveloper6/celery-manager"
Documentation = "https://pythondeveloper6.github.io/celery-manager/"
Repository = "https://github.com/Pythondeveloper6/celery-manager"
Issues = "https://github.com/Pythondeveloper6/celery-manager/issues"
Changelog = "https://github.com/Pythondeveloper6/celery-manager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# uvicorn is only needed to *serve* celery-manager standalone (the demo's
# run_dashboard.py, `uvicorn your_module:app`). Mounting the app into an
# existing ASGI stack doesn't need it, so it isn't a core dependency.
# Flask is WSGI; a2wsgi bridges the ASGI dashboard into it. See docs/integrations.md.
flask = ["a2wsgi>=1.10", "flask>=3.0"]
standalone = ["uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.17,<0.18", "uvicorn>=0.29", "flask>=3.0", "a2wsgi>=1.10"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
celery-manager = "celery_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/celery_manager"]

# An explicit allowlist, not a denylist. Hatchling's sdist default is "the
# whole project directory minus what VCS ignores", which pulled in 74 files of
# `.superpowers/` review diffs (several MB) and a stray root screenshot — a
# denylist would have needed updating the next time a tool drops a directory
# here. `frontend/` is included on purpose: it is the source the shipped
# `dashboard/static` bundle is built from, and an sdist that ships a
# prebuilt binary should ship what produced it. `plan.md` is not: it is a
# 190 KB internal working document.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/frontend",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/mkdocs.yml",
]
# Internal design docs; must not ship in the sdist.
exclude = ["/docs/superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

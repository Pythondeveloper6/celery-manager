name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]' flask a2wsgi
      - name: Lint
        run: ruff check .
      - name: Unit tier
        run: pytest -q -m unit -n auto
      - name: Integration tier (service-free parts)
        run: pytest -q -m integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q -m unit -n auto --cov=celery_manager --cov-report=term-missing:skip-covered --cov-fail-under=88

  races-postgres:
    name: Race tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: celery_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CM_TEST_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/celery_manager_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]' 'psycopg[binary]'
      - run: pytest -q tests/unit/test_races.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Committed bundle must match the source
        working-directory: .
        run: |
          if ! diff -r frontend/dist src/celery_manager/dashboard/static; then
            echo "::error::src/celery_manager/dashboard/static is stale; run 'npm run build' in frontend/ and copy frontend/dist over it."
            exit 1
          fi

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[docs]'
      - run: mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

  adapters:
    name: Optional adapters (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CM_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev,oidc,redbeat,django-beat,sqlalchemy-beat,schedule-descriptions]' 'fakeredis[lua]' dramatiq taskiq arq
      - run: pytest -q tests/unit/test_oidc_provider.py tests/unit/test_optional_scheduler_adapters.py tests/unit/test_sqlalchemy_scheduler.py tests/unit/test_cron_grammar.py tests/unit/test_singleton.py tests/unit/test_runner_adapters.py tests/unit/test_copy_schedules.py --junitxml=/tmp/adapters.xml
      - run: python -m tests.release_gate /tmp/adapters.xml

  database-contracts:
    name: Storage (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL 16
            image: postgres:16
            port: 5432
            health: pg_isready -U postgres
            url: postgresql+psycopg://postgres:CmTest_pass123!@localhost:5432/celery_manager_test
            schema: cm_release_contract
          - name: MySQL 8
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h127.0.0.1 -pCmTest_pass123! --silent
            url: mysql+pymysql://root:CmTest_pass123!@localhost:3306/celery_manager_test
            schema: ""
          - name: SQL Server 2022
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            health: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CmTest_pass123! -C -Q 'SELECT 1'
            url: mssql+pyodbc://sa:CmTest_pass123!@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
            schema: cm_release_contract
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: CmTest_pass123!
          POSTGRES_DB: celery_manager_test
          MYSQL_ROOT_PASSWORD: CmTest_pass123!
          MYSQL_DATABASE: celery_manager_test
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CmTest_pass123!
          MSSQL_PID: Developer
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      CM_STORAGE_DB_URL: ${{ matrix.url }}
      CM_STORAGE_SCHEMA: ${{ matrix.schema }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ODBC 18
        if: matrix.port == 1433
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - run: pip install -e '.[dev,sqlalchemy-beat]' 'psycopg[binary]' pymysql pyodbc
      - run: pytest -q tests/integration/test_storage_backends.py tests/integration/test_sql_schedule_storage.py tests/integration/test_release_upgrade.py tests/integration/test_native_operability.py --junitxml=/tmp/storage.xml
      - run: python -m tests.release_gate /tmp/storage.xml
      - run: pytest -q tests/unit/test_races.py
        env:
          CM_TEST_DB_URL: ${{ matrix.url }}

  brokers:
    name: Live brokers (Redis 7, RabbitMQ 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    env:
      CM_TEST_REDIS_URL: redis://localhost:6379/15
      CM_TEST_AMQP_URL: amqp://guest:guest@localhost:5672//
      CM_TEST_RABBIT_MGMT_URL: http://localhost:15672
      CM_TEST_RABBIT_MGMT_USER: guest
      CM_TEST_RABBIT_MGMT_PASSWORD: guest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/integration/test_rabbitmq.py tests/integration/test_held_tasks_brokers.py tests/integration/test_queue_messages_brokers.py tests/unit/test_broker_health.py tests/unit/test_queue_wait_and_depth.py --junitxml=/tmp/brokers.xml
      - run: python -m tests.release_gate /tmp/brokers.xml

  docker-example:
    name: Docker Compose example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f examples/docker/compose.yaml config -q
      - run: docker compose -f examples/docker/compose.yaml up --build -d
      - name: Dashboard answers and beat reports healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health/live >/dev/null 2>&1 || curl -fsS -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          docker compose -f examples/docker/compose.yaml ps
      - if: always()
        run: docker compose -f examples/docker/compose.yaml logs --tail 50
      - if: always()
        run: docker compose -f examples/docker/compose.yaml down -v

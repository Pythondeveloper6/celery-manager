name: Publish

# Publishing starts only from a pushed version tag (v0.3.0a2, v1.0.0, ...).
# Pushing to main never publishes. The tag must match pyproject's version and
# the tagged commit must pass the unit tier again before anything is built.
on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version $version"
            exit 1
          fi
      - name: Unit tier on the tagged commit
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q -m unit -n auto
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check whether the tagged version needs publishing
        id: version
        run: python .github/scripts/publish_status.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/celery-manager
    permissions:
      id-token: write  # OIDC token for trusted publishing / Pages deployment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: true

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI and smoke test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/v
          . /tmp/v/bin/activate
          ok=0
          for i in $(seq 1 30); do
            if pip install --pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "celery-manager==$VERSION"; then
              ok=1; break
            fi
            echo "Attempt $i failed; retrying in 10s"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "Could not install from TestPyPI" >&2; exit 1; }
          python -c "import celery_manager; assert celery_manager.__version__ == '$VERSION', celery_manager.__version__"
          celery-manager events --help

  pypi:
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/celery-manager
    permissions:
      id-token: write  # OIDC token for trusted publishing / Pages deployment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
          # PEP 740 provenance, signed with this workflow's OIDC identity.
          attestations: true

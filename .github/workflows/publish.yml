name: Publish

# Only a successful CI run for a push to main can start publishing.
# The checkout is the exact commit CI tested, never a newer moving main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check whether the tested version needs publishing
        id: version
        run: python .github/scripts/publish_status.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/celery-manager
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install from TestPyPI and smoke test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/v
          . /tmp/v/bin/activate
          ok=0
          for i in $(seq 1 30); do
            if pip install --pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "celery-manager==$VERSION"; then
              ok=1; break
            fi
            echo "Attempt $i failed; retrying in 10s"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "Could not install from TestPyPI" >&2; exit 1; }
          python -c "import celery_manager; assert celery_manager.__version__ == '$VERSION', celery_manager.__version__"
          celery-manager events --help

  pypi:
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/celery-manager
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

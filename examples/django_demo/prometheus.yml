global:
  scrape_interval: 15s

scrape_configs:
  - job_name: celery-manager
    metrics_path: /metrics
    # Demo-only token; must match CELERY_MANAGER_METRICS_TOKEN in docker-compose.yml.
    authorization:
      type: Bearer
      credentials: demo-metrics-token
    static_configs:
      - targets: ["dashboard:8001"]
